<div class="app-window" id="WordApp">
  <div class="app-header">
    <span class="app-title">&#128221; Word Guess</span>
    <div class="app-controls"><button class="minimize-btn">&ndash;</button><button class="close-btn">&times;</button></div>
  </div>
  <div class="app-content">
    <div class="wd">
      <div class="wd-board" id="wd-board"></div>
      <div class="wd-msg" id="wd-msg">Guess the 5-letter word in 6 tries.</div>
      <div class="wd-kb" id="wd-kb"></div>
      <button id="wd-new" class="wd-btn">New word</button>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
